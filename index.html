<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cesta Sadskou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1f2e;--bg2:#0d2636;--panel:#11303f;--raised:#173e50;--line:#24506a;--ink:#eef6f9;--soft:#9bb8c6;
  --sun:#ffcf4a;--sun2:#ffb526;--lake:#3fd9c4;--lake2:#2bb3e8;--led:#ff3355;--warn:#ff8a65;--ok:#5be39b;
  --c-basic:#1e90ff;--c-var:#dc143c;--c-input:#d400d4;--c-logic:#00a4a6;--c-math:#9400d3;--c-loop:#00a65a;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#e6f0f4;--bg2:#dbe8ee;--panel:#ffffff;--raised:#f1f7fa;--line:#c7dbe4;--ink:#0f2d3b;--soft:#4f6e7c;color-scheme:light}}
:root[data-theme="light"]{--bg:#e6f0f4;--bg2:#dbe8ee;--panel:#ffffff;--raised:#f1f7fa;--line:#c7dbe4;--ink:#0f2d3b;--soft:#4f6e7c;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 70% -10%,var(--bg2),var(--bg));color:var(--ink);font:400 17px/1.5 Lexend,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:Nunito,Lexend,sans-serif;margin:0}
.top{display:flex;align-items:center;gap:10px;padding:14px clamp(14px,3vw,32px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:900 20px Nunito,sans-serif;letter-spacing:.01em}
.brand svg{flex:none}
.sp{flex:1}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:14px;height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600}
.ib.pts{background:rgba(255,207,74,.12);border-color:rgba(255,207,74,.35);color:var(--sun);font:900 18px Nunito}
.wrap{max-width:1240px;margin:0 auto;padding:18px clamp(12px,3vw,32px) 40px}
/* path */
.path{overflow-x:auto;padding:6px 4px 14px}
.track{display:flex;align-items:flex-start;min-width:max-content}
.stop{display:flex;flex-direction:column;align-items:center;width:156px;position:relative}
.stop:not(:last-child)::after{content:"";position:absolute;top:27px;left:calc(50% + 30px);width:96px;height:5px;border-radius:3px;background:var(--line)}
.stop.done:not(:last-child)::after{background:var(--lake)}
.node{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;font-size:24px;position:relative;transition:transform .15s}
.node:hover{transform:scale(1.06)}
.stop.done .node{border-color:var(--lake);background:rgba(63,217,196,.15)}
.stop.now .node{border-color:var(--sun);box-shadow:0 0 0 7px rgba(255,207,74,.15)}
.stop.sel .node{outline:3px solid var(--lake2);outline-offset:4px}
.stop.locked .node{opacity:.5;cursor:default}
.stop .lbl{font:800 14px Nunito;margin-top:7px;text-align:center;line-height:1.15}
.stop .sub{font-size:12px;color:var(--soft)}
.chips{display:flex;flex-direction:column;gap:5px;margin-top:8px;align-items:center}
.chip{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--soft);max-width:150px;overflow:hidden;text-overflow:ellipsis}
.chip.open{border-style:solid;border-color:var(--sun);color:var(--ink)}
.chip.done{border-style:solid;border-color:var(--lake);color:var(--lake)}
.chip.sel{background:var(--raised)}
.chip[disabled]{opacity:.45;cursor:default}
/* main card */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(16px,2.5vw,32px);background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:clamp(18px,3vw,40px)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.kicker{color:var(--lake);font:800 15px Nunito;margin-bottom:6px}
.title{font:900 clamp(38px,5.4vw,68px)/1 Nunito;letter-spacing:-.02em;margin-bottom:12px}
.lead{font-size:clamp(18px,2vw,23px);color:var(--ink);opacity:.92;margin:0 0 20px;max-width:30ch}
.lead b{font-weight:600;color:var(--sun)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.btn{border:0;border-radius:16px;padding:13px 20px;font:800 17px Nunito;cursor:pointer;display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:#1a1a1a;background:linear-gradient(180deg,var(--sun),var(--sun2));box-shadow:0 6px 18px rgba(255,181,38,.25)}
.btn.go{background:linear-gradient(90deg,var(--lake),var(--lake2));color:#06222b;box-shadow:0 6px 18px rgba(43,179,232,.25)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.hint{background:rgba(255,138,101,.12);color:var(--warn);border:1px solid rgba(255,138,101,.4);box-shadow:none}
.btn.sm{padding:9px 14px;font-size:15px;border-radius:12px}
.btn:focus-visible,.ib:focus-visible,.node:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:3px solid var(--lake2);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.memo{display:flex;align-items:center;gap:14px;background:var(--raised);border-left:4px solid var(--sun);border-radius:16px;padding:14px 16px;margin:16px 0}
.memo .t{flex:1}
.memo b{display:block;font:800 17px Nunito}
.memo span{font-size:14px;color:var(--soft)}
.status{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);background:var(--raised);border-radius:99px;padding:5px 12px;margin-top:6px}
.status b{color:var(--ink)}
.tag{display:inline-block;font:800 12.5px Nunito;padding:3px 10px;border-radius:99px;margin-bottom:10px}
.tag.must{background:rgba(63,217,196,.15);color:var(--lake)}
.tag.vol{background:rgba(255,207,74,.15);color:var(--sun)}
/* steps */
.dots{display:flex;gap:6px;margin:0 0 14px}
.dots i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--lake)}
.st{font:900 30px/1.1 Nunito;margin:0 0 8px}
.cp{font-size:18px;margin:0 0 12px}
.newb{display:inline-block;background:var(--led);color:#fff;font:800 12px Nunito;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:6px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:12px 16px;margin-top:8px;cursor:pointer;font-size:18px;font-weight:500}
.opt:hover{border-color:var(--lake2)}
.opt.ok{border-color:var(--ok);background:rgba(91,227,155,.14)}
.opt.bad{border-color:var(--led);background:rgba(255,51,85,.12)}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer}
.choice.on{border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,207,74,.18)}
.choice .t{flex:1}.choice b{font:800 18px Nunito;display:block}.choice span{font-size:14px;color:var(--soft)}
.lv{color:var(--sun);letter-spacing:2px;font-size:15px}
.hintbox{border-left:4px solid var(--warn);background:rgba(255,138,101,.08);border-radius:0 12px 12px 0;padding:9px 13px;margin-top:10px;font-size:16px}
.newblock{border-left:4px solid var(--led);background:var(--raised);border-radius:0 14px 14px 0;padding:11px 14px;margin:10px 0;font-size:16px}
.checks label{display:flex;gap:10px;align-items:center;background:var(--raised);border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:500;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--lake)}
.refl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.refl button{border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:12px 6px;cursor:pointer;font-weight:600;font-size:15px}
.refl button span{display:block;font-size:32px}
.code{font:600 clamp(18px,2.4vw,24px) "JetBrains Mono",monospace;background:#05141d;color:var(--sun);padding:14px 16px;border-radius:14px;letter-spacing:.04em;word-break:break-all;border:1px solid var(--line)}
.big{font:900 64px/1 Nunito;color:var(--sun)}
.gcard{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--raised);border:2px solid var(--sun);border-radius:22px;padding:18px 22px;margin-top:10px}
.gname{font:900 28px/1.1 Nunito}.gsub{color:var(--soft);font-size:15px;margin-top:4px}
.gnum{font:900 96px/1 Nunito;color:var(--sun);min-width:80px;text-align:center}
.cl{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:16px;padding:12px 14px;margin-top:10px;cursor:pointer}
.cl.done{border-color:var(--lake)}
.cl .ti{flex:1;font:800 18px/1.15 Nunito}.cl .ti small{display:block;font:400 14px Lexend;color:var(--soft);margin-top:3px}
/* right demo */
.right{display:flex;flex-direction:column;gap:12px;min-width:0}
.demo{background:linear-gradient(180deg,#123a4e,#0c2a3a);border:1px solid var(--line);border-radius:24px;padding:clamp(12px,2vw,24px);display:flex;flex-direction:column;align-items:center;gap:12px;position:relative}
:root[data-theme="light"] .demo{background:linear-gradient(180deg,#d4e7ef,#c3dce7)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .demo{background:linear-gradient(180deg,#d4e7ef,#c3dce7)}}
#board{width:100%;max-width:520px;height:auto;cursor:pointer;touch-action:manipulation}
#board .hit{cursor:pointer}
.shake{animation:shk .45s ease-in-out}
@keyframes shk{15%{transform:rotate(-5deg) translateX(-6px)}35%{transform:rotate(5deg) translateX(6px)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.cap{display:flex;align-items:center;gap:10px;background:rgba(5,20,29,.55);border-radius:14px;padding:10px 16px;width:100%;justify-content:center;text-align:center;color:#eef6f9}
.cap b{display:block;font:800 16px Nunito}.cap span{font-size:13px;opacity:.75}
.toggle{display:inline-flex;background:rgba(5,20,29,.45);border-radius:12px;padding:4px;gap:4px}
.toggle button{border:0;background:transparent;color:#e3f0f4;border-radius:9px;padding:6px 12px;font:800 14px Nunito;cursor:pointer}
.toggle button.on{background:var(--sun);color:#1a1a1a}
.lucky{display:flex;align-items:center;gap:12px;font:800 15px Nunito;color:var(--ink)}
.lucky .n{background:var(--sun);color:#1a1a1a;border-radius:10px;padding:2px 10px;font:900 20px Nunito}
/* graph */
.gwrap{width:100%}
#gsvg{width:100%;height:auto;display:block;background:#0d2a3a;border-radius:16px}
.gn{cursor:pointer}
.gtotal{display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--ink);font-weight:600}
.gtotal b{font:900 30px Nunito;color:var(--sun)}
/* bars */
.dice2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:10px 6px 24px;background:var(--raised);border-radius:12px}
.bars div{flex:1;background:var(--lake2);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.bars div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-weight:800;font-size:13px}
.bars div b{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px}
.meter{width:100%;color:var(--ink)}
.meter .bar{height:16px;border-radius:9px;background:var(--raised);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
/* modal */
.modal{position:fixed;inset:0;background:rgba(3,12,18,.7);display:none;align-items:flex-start;justify-content:center;padding:16px;z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
#dlg{position:fixed;inset:0;background:rgba(3,12,18,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}#dlg.on{display:flex}#dlg .db{background:var(--panel);border:2px solid var(--sun);border-radius:20px;padding:20px;width:min(380px,100%)}
.modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:24px;width:min(620px,100%);margin:auto;padding:24px;position:relative}
.mbox h2{font:900 30px Nunito;margin-bottom:10px}
.x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-size:18px}
.gt{width:100%;border-collapse:collapse;margin:8px 0}
.gt td{padding:8px 10px;border-bottom:1px solid var(--line)}
.gt td:first-child{font:900 24px Nunito;width:50px;text-align:center;color:var(--sun)}
.box2{background:var(--raised);border-radius:16px;padding:14px 16px;margin:10px 0}
.box2 h3{font:800 19px Nunito;margin-bottom:4px}
.box2 ol,.box2 ul{margin:4px 0;padding-left:20px}
input.txt{font:inherit;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;width:100%;background:var(--raised);color:var(--ink);margin:4px 0 10px}
label.l{font-weight:600}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.45}
.badge.got{opacity:1;border-color:var(--sun);background:rgba(255,207,74,.08)}
.badge .e{font-size:30px}.badge b{display:block;font:800 15px Nunito}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
/* blocks */
.ws{background:#f6f9f7;background-image:radial-gradient(#c9d6ce 1.4px,transparent 1.6px);background-size:22px 22px;border-radius:12px;padding:12px;overflow-x:auto;margin:8px 0}
.ws > *{margin-bottom:8px}.ws > *:last-child{margin-bottom:0}
.blk{font:600 13px/1 "JetBrains Mono",monospace;color:#fff;display:inline-block;min-width:max-content}
.brow{display:flex;align-items:center;gap:6px;padding:7px 9px;background:var(--c);border-radius:6px;white-space:nowrap}
.cb{display:inline-flex;flex-direction:column}
.cb > .brow:first-child{border-radius:6px 6px 0 0}.cb > .brow.mid{border-radius:0}
.slot{border-left:12px solid var(--c);padding:4px 0 4px 4px;min-height:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.foot{height:12px;width:100px;background:var(--c);border-radius:0 0 6px 6px}
.cb.hat > .brow:first-child{border-radius:12px 12px 0 0;padding-top:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--c-var)}
.num{display:inline-block;min-width:22px;text-align:center;padding:2px 7px;border-radius:99px;background:#fff;color:#333}
.dd{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:5px;background:rgba(0,0,0,.18)}
.hex{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;background:var(--c-logic);clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,9px 100%,0 50%);filter:brightness(1.12)}
.mini{display:inline-grid;grid-template-columns:repeat(5,4px);gap:1px;padding:2px;background:#123;border-radius:2px;vertical-align:middle}
.mini i{width:4px;height:4px;background:#3a4a55;display:block}.mini i.on{background:#ff4d4d}
.ledpick{display:inline-grid;grid-template-columns:repeat(5,9px);gap:2px;padding:4px;background:rgba(0,0,0,.25);border-radius:4px}
.ledpick i{width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.25);display:block}.ledpick i.on{background:#ff4d4d}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.node{transition:none}}
/* v4 doplňky */
.lockbox{background:var(--raised);border:1px dashed var(--sun);border-radius:18px;padding:16px;margin:14px 0}
.lockbox input{font:800 22px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);width:100%;max-width:260px}
.phone{width:min(360px,100%);background:#0b0f14;border-radius:34px;padding:14px;border:3px solid #26313b;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.screen{background:#f4f6f8;border-radius:24px;min-height:440px;padding:14px;color:#13202a;font-size:15px}
.post{background:#fff;border-radius:16px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.post .hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 16px Nunito;flex:none}
.post .nm{font-weight:700}.post .tm{font-size:12px;color:#6b7a84}
.post .tx{font-size:16px;line-height:1.4;white-space:pre-line}
.post .img{margin-top:10px;border-radius:12px;height:120px;display:grid;place-items:center;font-weight:800;color:#fff;text-align:center;padding:8px}
.post .re{display:flex;gap:14px;font-size:13px;color:#6b7a84;margin-top:8px}
.ver{color:#1d9bf0;font-weight:900}
.msg{background:#e9edf1;border-radius:18px 18px 18px 4px;padding:12px 14px;line-height:1.5;font-size:16px}
.msg .from{font-size:12px;color:#6b7a84;margin-bottom:6px}
.seg{border-radius:6px;padding:1px 3px;cursor:pointer;border-bottom:2px dashed #9aa8b2}
.seg:hover{background:#dde6ec}
.seg.hit{background:#ffd9df;border-bottom-color:#ff3355}
.seg.miss{background:#e6e6e6;border-bottom-color:transparent;text-decoration:line-through;cursor:default}
.seg.show{background:#fff1c2;border-bottom-color:#e0a800}
.score{display:inline-flex;align-items:center;gap:8px;background:var(--raised);border-radius:99px;padding:6px 14px;font-weight:600}
.score b{font:900 20px Nunito;color:var(--sun)}
.ruleopt{display:flex;gap:10px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;cursor:pointer;font-weight:500}
.ruleopt input{width:22px;height:22px;accent-color:var(--lake)}
#scene{width:100%;height:auto;border-radius:18px;display:block}
#scene .hs{cursor:pointer}

html,body{overflow-x:hidden}
.top{flex-wrap:wrap}
@media (max-width:720px){
 .top{gap:6px;padding:10px 10px}
 .brand{font-size:17px;flex:1 1 100%}
 .sp{display:none}
 .ib{height:40px;min-width:40px;padding:0 10px;font-size:15px}
 .hs,#who{display:none}
 .wrap{padding:12px 10px 30px}
 .stage{padding:16px;border-radius:22px}
 .title{font-size:clamp(34px,10vw,48px)}
 .mbox{padding:18px}
}
.ws{overflow-x:hidden}
.hid>.brow,.hid>.brow *{color:transparent!important}
.hid>.brow .pill,.hid>.brow .num,.hid>.brow .dd,.hid>.brow .hex{background:rgba(255,255,255,.3)!important;box-shadow:none!important;filter:none!important}
.hid>.brow .mini,.hid>.brow .ledpick{background:rgba(255,255,255,.3)!important}.hid>.brow .mini i,.hid>.brow .ledpick i{background:transparent!important}
.silcap{font-size:14px;color:var(--soft);margin:12px 0 0;font-weight:600}
.upbox{border:2px dashed var(--lake2);border-radius:18px;padding:14px 16px;margin-top:12px;background:var(--raised)}
.upbox.over{border-color:var(--sun);background:rgba(255,207,74,.08)}
.ck{padding:8px 10px;border-radius:10px;margin-top:6px;font-weight:600}.ck.y{background:rgba(91,227,155,.14)}.ck.n{background:rgba(255,51,85,.12)}
.ck span{display:block;font-weight:400;font-size:14px;margin-top:2px}
.linkbtn{background:none;border:0;color:var(--soft);text-decoration:underline;cursor:pointer;font:inherit;padding:0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="2" y="2" width="26" height="26" rx="7" fill="#11303f" stroke="#3fd9c4" stroke-width="2"/><g fill="#ff3355"><circle cx="10" cy="10" r="2.2"/><circle cx="20" cy="10" r="2.2"/><circle cx="15" cy="15" r="2.2"/><circle cx="10" cy="20" r="2.2"/><circle cx="20" cy="20" r="2.2"/></g></svg>Cesta Sadskou</div>
  <div class="sp"></div>

const BASE_N={S:{x:60,y:250,n:"Škola",ly:40},A:{x:150,y:120,n:"Náměstí"},K:{x:300,y:60,n:"Kostel"},P:{x:190,y:280,n:"Pošta",ly:40},T:{x:320,y:190,n:"Klub"},D:{x:390,y:300,n:"Nádraží",ly:40}};

const weights=(tag,E)=>{const R=rng(seed(tag));return E.map(([a,b])=>[a,b,2+Math.floor(R()*8)]);};
function graph(cfg){
  const {N,E,S,D,blocked}=cfg,isB=(a,b)=>blocked&&((blocked[0]===a&&blocked[1]===b)||(blocked[0]===b&&blocked[1]===a));
  const w=(a,b)=>{if(isB(a,b))return null;const e=E.find(e=>(e[0]===a&&e[1]===b)||(e[0]===b&&e[1]===a));return e?e[2]:null;};
  const dist={},prev={},Q=new Set(Object.keys(N));for(const k of Q)dist[k]=Infinity;dist[S]=0;
  while(Q.size){const u=[...Q].reduce((a,b)=>dist[a]<dist[b]?a:b);Q.delete(u);for(const v of Object.keys(N)){const ww=w(u,v);if(ww&&dist[u]+ww<dist[v]){dist[v]=dist[u]+ww;prev[v]=u;}}}
  const best=dist[D],via=[];{let c=D;while(prev[c]&&prev[c]!==S){via.unshift(prev[c]);c=prev[c];}}
  if(cfg.probe)return {best,via};
  let path=[S],tries=0,hints=0,shown=0;const total=()=>path.slice(1).reduce((s,n,i)=>s+w(path[i],n),0);
  const draw=msg=>{
    let e="";E.forEach(([a,b,ww])=>{const bl=isB(a,b),on=path.some((n,i)=>i&&((path[i-1]===a&&n===b)||(path[i-1]===b&&n===a)));const A=N[a],B=N[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
      e+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${bl?"#ff3355":on?"#ffcf4a":"#7fa6b6"}" stroke-width="${on?9:4}" stroke-dasharray="${bl?"8 8":""}" stroke-linecap="round" opacity="${on||bl?1:.7}"/>`+(bl?`<text x="${mx}" y="${my+9}" text-anchor="middle" style="font:900 26px Nunito;fill:#ff3355">✕</text>`:`<circle cx="${mx}" cy="${my}" r="15" fill="#0a1f2e" stroke="#7fa6b6" stroke-width="2"/><text x="${mx}" y="${my+6}" text-anchor="middle" style="font:900 16px Nunito;fill:#eef6f9">${ww}</text>`);});
    let n="";for(const k in N){const p=N[k],cur=path[path.length-1]===k,inp=path.includes(k),can=!!w(path[path.length-1],k)&&!inp;
      n+=`<g class="gn" data-n="${k}" tabindex="0" role="button" aria-label="${p.n}"><circle cx="${p.x}" cy="${p.y}" r="${k===S||k===D?22:18}" fill="${k===D?"#ff3355":k===S?"#3fd9c4":inp?"#ffcf4a":"#173e50"}" stroke="${can?"#ffcf4a":"#7fa6b6"}" stroke-width="${can?5:2.5}"/>${cur?`<circle cx="${p.x}" cy="${p.y}" r="7" fill="#0a1f2e"/>`:""}<text x="${p.x}" y="${p.y+(p.ly||-28)}" text-anchor="middle" style="font:800 15px Nunito;fill:#eef6f9">${p.n}</text></g>`;}
    $("#right").innerHTML=`<div class="demo"><svg id="gsvg" viewBox="0 0 ${cfg.vw||440} ${cfg.vh||350}">${e}${n}</svg><div class="gtotal"><span>Cesta trvá</span><b>${total()} min</b></div><div class="cap"><div><b>Klikej na místa, čísla jsou minuty</b><span>Kliknutím na předchozí místo se vrátíš</span></div></div></div>`;
    $("#gmsg").innerHTML=msg||"";
    $$("[data-n]").forEach(g=>{const go=()=>{const k=g.dataset.n,last=path[path.length-1];if(path.length>1&&k===path[path.length-2]){path.pop();return draw();}if(!w(last,k)||path.includes(k))return;path.push(k);
      if(k===D){tries++;if(total()===best){draw(`<p class="cp" style="color:var(--ok);font-weight:600">Nejrychlejší cesta: ${best} minut!</p>`);return setTimeout(()=>cfg.win(Math.min(15,hints+Math.max(0,tries-1))),1200);}draw(`<div class="hintbox">Dorazil jsi za ${total()} min. Jde to rychleji! Vrať se a zkus jinou cestu.</div>`);}else draw();};g.onclick=go;g.onkeydown=e=>{if(e.key==="Enter")go();};});
  };
  const H=["Sečti minuty na každé cestě. Krátká čísla neznamenají vždycky krátkou cestu.",via.length?`Nejrychlejší cesta vede přes: ${N[via[0]].n}.`:"Nejrychlejší je jít přímo."];
  left(cfg.head+`<div id="gmsg"></div><div id="ghint"></div><div class="row"><button class="btn hint sm" id="hn">💡 Nápověda</button><button class="btn ghost sm" id="rs">Začít znovu</button>${cfg.back?'<button class="btn ghost sm" id="bk">◀ Výzvy</button>':""}</div>`);
  $("#hn").onclick=()=>{if(shown<H.length){hints++;$("#ghint").innerHTML+=`<div class="hintbox">${H[shown++]}</div>`;}if(shown>=H.length)$("#hn").remove();};
  $("#rs").onclick=()=>{path=[S];draw();};if(cfg.back)$("#bk").onclick=cfg.back;draw();
}

function bp(a,v,w){for(let i=w-1;i>=0;i--)a.push((v>>>i)&1);}
function bt(a,p,w){let v=0;for(let i=0;i<w;i++)v=(v<<1)|a[p+i];return v;}
function ks5(e,n){const o=[];let i=0;while(o.length<n){const h=fnv(e+"|ks"+i+"|"+CFG5.SIGN);for(let b=0;b<32&&o.length<n;b++)o.push((h>>>b)&1);i++;}return o;}

function makeSave(){
  const a=[],cur=curLesson(),S=cur===1?S1:cur===2?S2:null;
  bp(a,3,2);LS.forEach(l=>bp(a,G.unlocked[l]?1:0,1));LS.forEach(l=>bp(a,G.done[l]?1:0,1));
  bp(a,cur,3);bp(a,S?Math.min(7,S.step):0,3);bp(a,S?Math.min(31,S.pen||0):0,5);bp(a,G.disp==="tecky"?1:0,1);
  [1,2,3,4].forEach(i=>bp(a,G.ch.l1[i]?1:0,1));[1,2,3].forEach(i=>bp(a,G.ch.l2[i]?1:0,1));[1,2].forEach(i=>bp(a,G.ch.l4[i]?1:0,1));
  bp(a,G.side.d1?1:0,1);bp(a,G.side.h1?1:0,1);bp(a,G.helper?1:0,1);bp(a,Math.min(7,G.jUsed||0),3);bp(a,Math.min(511,G.pts),9);
  LS.forEach(l=>bp(a,Math.min(7,G.grades[l]||0),3));LS.forEach(l=>bp(a,G.conf&&G.conf[l]?1:0,1));bp(a,S&&S.hexOk&&!S.hexSkip?1:0,1);LS.forEach(l=>bp(a,G.hexOk&&G.hexOk[l]?1:0,1));
  while(a.length%5)a.push(0);
  const e=G.email,k=ks5(e,a.length),pb=a.join("");let s="";for(let i=0;i<a.length;i+=5){let v=0;for(let j=0;j<5;j++)v=(v<<1)|(a[i+j]^k[i+j]);s+=AL5[v];}
  const mac=fnv(e+"|"+pb+"|"+CFG5.SIGN)&0xFFFFF;for(let i=3;i>=0;i--)s+=AL5[(mac>>>(i*5))&31];
  return s.match(/.{1,4}/g).join("-");}
function readSave(code,e){
  const s=String(code).toUpperCase().replace(/[^A-Z0-9]/g,"");if(s.length<8)return null;
  const a=[];for(const c of s.slice(0,-4)){const v=AL5.indexOf(c);if(v<0)return null;bp(a,v,5);}
  const k=ks5(e,a.length);for(let i=0;i<a.length;i++)a[i]^=k[i];
  let mac=0;for(const c of s.slice(-4)){const v=AL5.indexOf(c);if(v<0)return null;mac=(mac<<5)|v;}
  if(((fnv(e+"|"+a.join("")+"|"+CFG5.SIGN)&0xFFFFF)>>>0)!==(mac>>>0))return null;
  let p=0;const t=w=>{const v=bt(a,p,w);p+=w;return v;};if(t(2)!==3)return null;
  const d={unl:LS.map(()=>t(1)),done:LS.map(()=>t(1)),cur:t(3),step:t(3),pen:t(5),disp:t(1),c1:[t(1),t(1),t(1),t(1)],c2:[t(1),t(1),t(1)],c4:[t(1),t(1)],d1:t(1),h1:t(1),helper:t(1),jUsed:t(3),pts:t(9)};d.gr=LS.map(()=>t(3));d.conf=LS.map(()=>t(1));d.hx=t(1);d.hok=LS.map(()=>t(1));return d;}
function applySave(d){

 <div class="row"><button class="btn ghost sm" id="thermo">Učitel: ukazatel třídy</button></div>`);

function thermo(){let T={};try{T=JSON.parse(localStorage.getItem("ukazatel")||"{}");}catch(e){}
  T=Object.assign({cls:"7.A",done:0,m:[[15,"hudba při práci"],[30,"hodina volné tvorby"],[45,"hodina venku s micro:bity"]]},T);
  const draw=()=>{const max=T.m[T.m.length-1][0],pc=v=>Math.min(100,v/max*100),hit=T.m.filter(x=>T.done>=x[0]).length,next=T.m.find(x=>T.done<x[0]);

     <p class="cp">${next?`Do další odměny zbývá <b>${next[0]-T.done}</b>: ${esc(next[1])}`:"Všechny odměny splněny! 🎉"}</p>

     <p class="status">Splněné mety: <b>${hit} / ${T.m.length}</b></p>
     <details style="margin-top:12px"><summary>Upravit (učitel)</summary><div class="row"><input class="txt" id="tc" value="${esc(T.cls)}" style="max-width:110px"><input class="txt" id="td" type="number" value="${T.done}" style="max-width:110px"><button class="btn ghost sm" id="tplus">+1</button><button class="btn ghost sm" id="tminus">−1</button></div>
     ${T.m.map((x,i)=>`<div class="row"><input class="txt" data-mv="${i}" type="number" value="${x[0]}" style="max-width:90px"><input class="txt" data-mt="${i}" value="${esc(x[1])}"></div>`).join("")}<div class="row"><button class="btn sm" id="ts">Uložit</button></div></details>`);
    const sv=()=>{try{localStorage.setItem("ukazatel",JSON.stringify(T));}catch(e){}draw();};

  draw();}

/* ===================== ODEVZDÁNÍ PROGRAMU (.hex) ===================== */
function hexSource(text){
  const recs=[],all=[];
  for(const l of text.split(/\r?\n/)){if(l[0]!==":")continue;const n=parseInt(l.substr(1,2),16),t=parseInt(l.substr(7,2),16);
    const bytes=[];for(let i=0;i<n;i++)bytes.push(parseInt(l.substr(9+i*2,2),16));if(t===14)recs.push(...bytes);else if(t===0||t===13)all.push(...bytes);}
  const MAG=[0x41,0x14,0x0E,0x2F,0xB8,0x2F,0xA2,0xBB];
  const find=a=>{outer:for(let i=0;i+8<a.length;i++){for(let j=0;j<8;j++)if(a[i+j]!==MAG[j])continue outer;return i;}return -1;};
  let d=recs,i=find(recs);if(i<0){d=all;i=find(all);}if(i<0)return null;
  const ml=d[i+8]|d[i+9]<<8,tl=(d[i+10]|d[i+11]<<8|d[i+12]<<16|d[i+13]<<24)>>>0;
  const meta=JSON.parse(new TextDecoder().decode(new Uint8Array(d.slice(i+16,i+16+ml))));
  const raw=d.slice(i+16+ml,i+16+ml+tl);
  let s=LZMA.decompress(raw);if(typeof s!=="string")s=new TextDecoder().decode(new Uint8Array(s.map(b=>b&255)));
  const files=JSON.parse(s.slice(meta.headerSize||0));
  return {name:meta.name||"",ts:files["main.ts"]||""};
}
function checkProgram(kind,ts){
  const T=ts.replace(/\s+/g," "),R=[],ok=(t,b,why)=>R.push({t,ok:!!b,why:b?"":why});
  const knp=/randint\(\s*1\s*,\s*3\s*\)/.test(T);
  if(kind==="kostka"){
    const l=L();
    const m=T.match(/(\w+)\s*=\s*randint\(\s*1\s*,\s*6\s*\)/),v=m?m[1]:null;
    ok("Zatřesení spustí hod",/input\.onGesture\(\s*Gesture\.Shake/.test(T),"Chybí blok při pohybu zatřesení.");
    ok("Náhodné číslo od 1 do 6",!!v,knp?"Máš pořád náhodné číslo 1 až 3. To je Kámen, nůžky, papír, ne kostka.":"Chybí nastav proměnnou na náhodné číslo od 1 do 6.");
    const cmpL=v&&new RegExp("(\\b"+v+"\\s*===?\\s*"+l+"\\b|\\b"+l+"\\s*===?\\s*"+v+"\\b)").test(T);
    const other=v&&(T.match(new RegExp("\\b"+v+"\\s*===?\\s*(\\d+)"))||[])[1];
    ok("Místo čísla "+l+" smajlík",cmpL&&/IconNames\.Happy/.test(T),!v?"Nejdřív oprav náhodné číslo.":(!cmpL&&other&&other!==String(l))?"Smajlík máš u čísla "+other+", ale tvoje číslo je "+l+".":!cmpL?"Chybí když "+v+" = "+l+".":"V části tak chybí veselý smajlík.");
    const leds=(T.match(/basic\.showLeds/g)||[]).length;
    ok("Ukáže, co padlo",v&&(new RegExp("showNumber\\(\\s*"+v+"\\s*\\)").test(T)||leds>=5),"Chybí ukaž číslo "+(v||"Kostka")+" (nebo tečky pro každé číslo).");
    return {R,extra:leds>=5?"tecky":"cislo",knp};
  }
  if(kind==="laska"){
    const m=T.match(/(\w+)\s*=\s*randint\(\s*0\s*,\s*4\s*\)/),v=m?m[1]:null;
    ok("Spuštění dotekem pinu 0",/input\.onPinPressed\(\s*TouchPin\.P0/.test(T),"Chybí blok při stisknutí pinu P0.");
    ok("Náhodné číslo od 0 do 4",!!v,knp?"Tohle je Kámen, nůžky, papír, ne láskoměr.":"Chybí nastav proměnnou na náhodné číslo od 0 do 4.");
    const got=v?[0,1,2,3,4].filter(n=>new RegExp("\\b"+v+"\\s*===?\\s*"+n+"\\b").test(T)).length:0,leds=(T.match(/basic\.showLeds/g)||[]).length;
    ok("Srdce pro 0 až 4",got>=5&&leds>=5,v?"Máš "+got+" z 5 větví, každá potřebuje svůj obrázek.":"Nejdřív oprav náhodné číslo.");
    ok("Srdce chvíli svítí",/basic\.pause\(/.test(T),"Chybí čekej za srdcem.");
    ok("Po startu text",/basic\.showString\(/.test(T),"Chybí zobraz text při startu.");
    return {R,knp};
  }
}
function uploadBox(S,kind){
  const r=S.hexRes;
  return `<div class="upbox" id="upbox"><b>📤 Odevzdej svůj program</b><p style="margin:6px 0 0;font-size:15px">V MakeCode klikni na 💾 vedle názvu projektu. Stažený soubor <b>.hex</b> přetáhni sem nebo ho vyber.</p>
   <label class="btn ghost sm" style="margin-top:10px">Vybrat soubor .hex<input type="file" id="upf" accept=".hex" hidden></label>
   ${r?`<div style="margin-top:12px">${r.err?`<p class="cp" style="color:var(--warn)">${esc(r.err)}</p>`:`<p style="margin:0 0 6px;color:var(--soft);font-size:14px">Soubor: ${esc(r.file)} · projekt „${esc(r.name)}“</p>`+r.R.map(x=>`<div class="ck ${x.ok?"y":"n"}">${x.ok?"✓":"✗"} ${esc(x.t)}${x.ok?"":`<span>${esc(x.why)}</span>`}</div>`).join("")+(S.hexOk?`<p class="cp" style="color:var(--ok);font-weight:800;margin-top:10px">Program je v pořádku! Nahraj ho do micro:bitu a vyzkoušej.</p>`:`<p class="cp" style="margin-top:10px">Oprav to v MakeCode, ulož znovu a nahraj nový soubor.</p>`)}</div>`:""}
   ${S.hexOk?"":`<p style="margin:10px 0 0;font-size:13px"><button class="linkbtn" id="upskip">Soubor nejde nahrát? Pan učitel to zkontroluje sám</button></p>`}</div>`;
}
function wireUpload(S,kind){
  const box=$("#upbox");if(!box)return;
  const handle=f=>{if(!f)return;const rd=new FileReader();rd.onload=()=>{let res;try{const src=hexSource(String(rd.result));
      if(!src)res={err:"V souboru jsem nenašel program. Je to opravdu soubor .hex z MakeCode?"};else{const c=checkProgram(kind,src.ts);res={file:f.name,name:src.name,R:c.R};S.hexOk=c.R.every(x=>x.ok);}}
    catch(e){res={err:"Soubor se nepodařilo přečíst. Ulož projekt v MakeCode znovu."};}
    S.hexRes=res;S.hexTries=(S.hexTries||0)+1;S.redraw();};rd.readAsText(f);};
  $("#upf").onchange=e=>handle(e.target.files[0]);
  box.addEventListener("dragover",e=>{e.preventDefault();box.classList.add("over");});
  box.addEventListener("dragleave",()=>box.classList.remove("over"));
  box.addEventListener("drop",e=>{e.preventDefault();box.classList.remove("over");handle(e.dataTransfer.files[0]);});
  const sk=$("#upskip");if(sk)sk.onclick=()=>dlgPin(()=>{S.hexOk=true;S.hexRes={file:"-",name:"kontrola učitelem",R:[{t:"Pan učitel zkontroluje program sám",ok:true}]};S.hexSkip=true;S.redraw();});
}
